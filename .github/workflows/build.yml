name: Build and verify PullOver Pro development
on:
  workflow_dispatch:
  push:
    branches: [beta-development, 'debug/**']
  pull_request:
    branches: [beta-development]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@v4
      - name: Configure Theos path
        run: echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Install tools
        run: brew install ldid dpkg make
      - name: Install pinned Theos and SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 304e0799973e8145f32e4ca2de6c747a84b758ce
          git -C "$THEOS" submodule update --init --recursive
          git clone --no-checkout https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Static checks
        run: |
          python3 scripts/verify.py
          mkdir -p diagnostics
          python3 tests/LifecycleTests.py | tee diagnostics/lifecycle-tests.log
      - name: Clang static analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          perl "$THEOS/vendor/logos/bin/logos.pl" Tweak.xm > diagnostics/Tweak.mm
          xcrun clang++ --analyze -Werror -fobjc-arc -target arm64-apple-ios15.0 \
            -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" \
            -I "$THEOS/vendor/include" -I "$THEOS/include" -I . \
            -Xanalyzer -analyzer-output=text diagnostics/Tweak.mm \
            2>&1 | tee diagnostics/analysis.log
      - name: Analyze app data loader
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ --analyze -Werror -fobjc-arc -target arm64-apple-ios15.0 \
            -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" \
            -Xanalyzer -analyzer-output=text PPOAppData.mm \
            2>&1 | tee diagnostics/appdata-analysis.log
      - name: Test app data loading and persistence
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            tests/AppDataTests.mm PPOAppData.mm -o "$RUNNER_TEMP/ppo-appdata-tests"
          "$RUNNER_TEMP/ppo-appdata-tests" | tee diagnostics/appdata-tests.log
      - name: Analyze isolated helper
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang --analyze -Wall -Wextra -Werror -fobjc-arc -target arm64-apple-ios15.0 \
            -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" \
            -Xanalyzer -analyzer-output=text tools/app-list/main.m \
            2>&1 | tee diagnostics/helper-analysis.log
      - name: Analyze launcher and test ABI guards
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ --analyze -Wall -Wextra -Werror -fobjc-arc -target arm64-apple-ios15.0 \
            -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" \
            -Xanalyzer -analyzer-output=text tools/app-launch/main.mm \
            2>&1 | tee diagnostics/launcher-analysis.log
          xcrun clang++ -Wall -Wextra -Werror -fobjc-arc -framework Foundation \
            tests/LaunchABITests.mm -o "$RUNNER_TEMP/ppo-abi-tests"
          "$RUNNER_TEMP/ppo-abi-tests" | tee diagnostics/launcher-tests.log
      - name: Analyze and test process runner
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ --analyze -Wall -Wextra -Werror -fobjc-arc -target arm64-apple-ios15.0 \
            -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" \
            -Xanalyzer -analyzer-output=text PPOLaunchProcess.mm \
            2>&1 | tee diagnostics/process-analysis.log
          xcrun clang++ -Wall -Wextra -Werror -fobjc-arc -framework Foundation \
            tests/ProcessTests.mm PPOLaunchProcess.mm -o "$RUNNER_TEMP/ppo-process-tests"
          "$RUNNER_TEMP/ppo-process-tests" | tee diagnostics/process-tests.log
      - name: Analyze and test bridge isolation
        shell: bash
        run: |
          set -euo pipefail
          for source in PPOBridgeClient.mm PPOBridgeProtocol.mm tools/bridge/PPOWorkspace.mm tools/bridge/PPOBridgeService.mm tools/bridge/main.mm; do
            xcrun clang++ --analyze -std=c++17 -Wall -Wextra -Werror -fobjc-arc -target arm64-apple-ios15.0 \
              -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -I . \
              -Xanalyzer -analyzer-output=text "$source"
          done 2>&1 | tee diagnostics/bridge-analysis.log
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            tests/BridgeIOTests.cpp PPOBridgeIO.cpp -o "$RUNNER_TEMP/ppo-bridge-io-tests"
          "$RUNNER_TEMP/ppo-bridge-io-tests" | tee diagnostics/bridge-io-tests.log
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fobjc-arc -framework Foundation -framework CoreFoundation \
            tests/BridgeProtocolTests.mm PPOBridgeProtocol.mm -o "$RUNNER_TEMP/ppo-bridge-protocol-tests"
          "$RUNNER_TEMP/ppo-bridge-protocol-tests" | tee diagnostics/bridge-protocol-tests.log
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fobjc-arc -framework Foundation -framework CoreFoundation \
            tests/BridgeServiceTests.mm tools/bridge/PPOBridgeService.mm PPOBridgeProtocol.mm PPOAppData.mm \
            -o "$RUNNER_TEMP/ppo-bridge-service-tests"
          "$RUNNER_TEMP/ppo-bridge-service-tests" | tee diagnostics/bridge-service-tests.log
      - name: Test actual service subprocess and mailbox
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -c PPOBridgeIO.cpp -o "$RUNNER_TEMP/ppo-bridge-io.o"
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fobjc-arc \
            -DPPO_BRIDGE_TESTING -Dmain=PPOBridgeServerMain -c tools/bridge/main.mm \
            -o "$RUNNER_TEMP/ppo-bridge-server-main.o"
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fobjc-arc -DPPO_BRIDGE_TESTING \
            -framework Foundation -framework CoreFoundation tests/BridgeIntegrationTests.mm \
            "$RUNNER_TEMP/ppo-bridge-server-main.o" "$RUNNER_TEMP/ppo-bridge-io.o" \
            PPOBridgeClient.mm PPOBridgeProtocol.mm PPOAppData.mm tools/bridge/PPOBridgeService.mm \
            -o "$RUNNER_TEMP/ppo-bridge-integration-tests"
          "$RUNNER_TEMP/ppo-bridge-integration-tests" | tee diagnostics/bridge-integration-tests.log
      - name: Analyze and test read-only scene preflight
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ --analyze -std=c++17 -Wall -Wextra -Werror -fobjc-arc -target arm64-apple-ios15.0 \
            -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" \
            -Xanalyzer -analyzer-output=text PPOScenePreflight.mm 2>&1 | tee diagnostics/scene-analysis.log
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fobjc-arc -framework Foundation -framework CoreFoundation \
            tests/ScenePreflightTests.mm PPOScenePreflight.mm PPOBridgeProtocol.mm \
            -o "$RUNNER_TEMP/ppo-scene-preflight-tests"
          "$RUNNER_TEMP/ppo-scene-preflight-tests" | tee diagnostics/scene-tests.log
      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/usr/local/opt/make/libexec/gnubin:$PATH"
          mkdir -p diagnostics
          {
            git rev-parse HEAD
            git -C "$THEOS" rev-parse HEAD
            xcrun clang --version
            make --version
            echo "SDK=iPhoneOS16.5; deployment=15.0; scheme=rootless"
          } > diagnostics/build-environment.txt
          make SHELL=/bin/bash clean
          make SHELL=/bin/bash package FINALPACKAGE=1 2>&1 | tee diagnostics/build.log
      - name: Inspect package and binary
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/usr/local/opt/make/libexec/gnubin:$PATH"
          python3 scripts/verify.py packages/*.deb
          mkdir -p "$RUNNER_TEMP/ppo-package"
          dpkg-deb -x packages/*.deb "$RUNNER_TEMP/ppo-package"
          dylib="$RUNNER_TEMP/ppo-package/var/jb/Library/MobileSubstrate/DynamicLibraries/PullOverProDiagnostic.dylib"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          xcrun otool -L "$dylib" | tee diagnostics/dependencies.txt
          xcrun dwarfdump --uuid "$dylib" | tee diagnostics/uuids.txt
          helper="$RUNNER_TEMP/ppo-package/var/jb/usr/bin/ppo-apps"
          xcrun lipo "$helper" -verify_arch arm64 arm64e
          xcrun otool -L "$helper" | tee diagnostics/helper-dependencies.txt
          xcrun dwarfdump --uuid "$helper" | tee diagnostics/helper-uuids.txt
          launcher="$RUNNER_TEMP/ppo-package/var/jb/usr/bin/ppo-open"
          xcrun lipo "$launcher" -verify_arch arm64 arm64e
          xcrun otool -L "$launcher" | tee diagnostics/launcher-dependencies.txt
          xcrun dwarfdump --uuid "$launcher" | tee diagnostics/launcher-uuids.txt
          bridge="$RUNNER_TEMP/ppo-package/var/jb/usr/bin/ppo-bridge"
          xcrun lipo "$bridge" -verify_arch arm64 arm64e
          xcrun otool -L "$bridge" | tee diagnostics/bridge-dependencies.txt
          xcrun dwarfdump --uuid "$bridge" | tee diagnostics/bridge-uuids.txt
          shasum -a 256 packages/*.deb > diagnostics/SHA256SUMS
      - name: Write validation report
        run: python3 scripts/write-validation-report.py diagnostics "${{ github.sha }}"
      - name: Upload development deb and evidence
        uses: actions/upload-artifact@v4
        with:
          name: PullOverPro-0.7.0-scene-preflight-${{ github.sha }}
          path: |
            packages/*.deb
            diagnostics/
            .theos/obj/**/*.dSYM/**
          include-hidden-files: true
          if-no-files-found: error


