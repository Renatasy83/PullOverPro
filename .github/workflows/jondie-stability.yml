name: Jond_ie derivative - movable window RC3, tests and rootless candidate
on:
  workflow_dispatch:
  push:
    branches: ['improve/jondie-stability', 'feature/jondie-window-size', 'feature/jondie-window-move']
    paths: ['jondie-port/**', '.github/workflows/jondie-stability.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      LC_ALL: C
      LANG: C
    defaults:
      run:
        working-directory: jondie-port
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Theos path
        run: echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Install build tools
        run: brew install ldid dpkg make
      - name: Install pinned Theos and SDK
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 304e0799973e8145f32e4ca2de6c747a84b758ce
          git -C "$THEOS" submodule update --init --recursive
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$RUNNER_TEMP/sdks" checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          echo "/usr/local/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Validate source/package contracts
        id: source
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 scripts/verify.py | tee diagnostics/source-contracts.log
      - name: Execute actual helper and fake-interface fixtures
        id: tests
        run: scripts/run-tests.sh
      - name: Analyze production translation units
        id: analysis
        run: |
          set -euo pipefail
          scripts/analyze.sh 2>&1 | tee diagnostics/analysis.log
      - name: Compile and package release candidate
        id: build
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.tests.outcome == 'success' }}
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git -C "$THEOS" rev-parse HEAD
            xcrun clang --version
            make --version
            echo 'SDK=iPhoneOS16.5; deployment=15.0; scheme=rootless; arm64+modern-arm64e'
          } > diagnostics/build-environment.txt
          make SHELL=/bin/bash clean
          make SHELL=/bin/bash -j2 package FINALPACKAGE=1 2>&1 | tee diagnostics/build.log
          if grep -E 'incompatible arm64e ABI|error:' diagnostics/build.log; then exit 1; fi
      - name: Inspect rootless payload, signatures and required ABI
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          packages = list(pathlib.Path('packages').glob('*.deb'))
          assert len(packages) == 1, f'Expected one candidate DEB, found {len(packages)}'
          PY
          dpkg-deb -c packages/*.deb | tee diagnostics/payload.txt
          dpkg-deb -I packages/*.deb | tee diagnostics/package-control.txt
          python3 scripts/verify.py packages/*.deb | tee diagnostics/package-inspection.log
          mkdir -p "$RUNNER_TEMP/jondie-package"
          dpkg-deb -x packages/*.deb "$RUNNER_TEMP/jondie-package"
          for relative in Library/MobileSubstrate/DynamicLibraries/PullOverPro.dylib Library/PreferenceBundles/PullOverProPrefs.bundle/PullOverProPrefs; do
            binary="$RUNNER_TEMP/jondie-package/var/jb/$relative"
            xcrun lipo "$binary" -verify_arch arm64 arm64e
            xcrun otool -L "$binary"
            xcrun dwarfdump --uuid "$binary"
          done 2>&1 | tee diagnostics/binary-inspection.log
          python3 - <<'PYDIAG'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'jondie-package/var/jb'
          results = []
          for relative in ('Library/MobileSubstrate/DynamicLibraries/PullOverPro.dylib', 'Library/PreferenceBundles/PullOverProPrefs.bundle/PullOverProPrefs'):
              result = subprocess.run(['codesign', '--verify', '--verbose=2', str(root / relative)], text=True, capture_output=True)
              results.append({'binary': relative, 'exitCode': result.returncode, 'stdout': result.stdout, 'stderr': result.stderr})
          pathlib.Path('diagnostics/MACOS_CODESIGN_DIAGNOSTIC.json').write_text(json.dumps({
              'results': results, 'isReleaseGate': False,
              'macosVerificationSucceeded': all(r['exitCode'] == 0 for r in results),
              'appleTrustVerified': False, 'deviceTrustVerified': False,
              'scope': 'Theos/ldid embedded signatures are checked independently for code-page and special-slot hash integrity. macOS codesign acceptance is recorded separately; neither establishes jailbreak device trust.'
          }, indent=2) + '\n')
          for result in results:
              print(result['binary'], 'macOS codesign exit:', result['exitCode'])
              print(result['stderr'].strip())
          PYDIAG
          shasum -a 256 packages/*.deb > diagnostics/SHA256SUMS
      - name: Record actual validation scope
        if: always()
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          ANALYSIS_RESULT: ${{ steps.analysis.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path('diagnostics')
          out.mkdir(exist_ok=True)
          package = out / 'PACKAGE_VALIDATION.json'
          report = {
            'commit': os.environ['GITHUB_SHA'],
            'upstream': '076da8f07e707453bc58ed9baadeefb40f0e93e4',
            'runner': 'macos-15-intel', 'candidateVersion': '3.0.2~rc3',
            'outcomes': {name: os.environ[name + '_RESULT'] for name in ('SOURCE', 'TESTS', 'ANALYSIS', 'BUILD', 'PACKAGE')},
            'expectedFixtureSuites': 10,
            'feature': 'Draggable title bar, aspect-preserving resize and per-application size/position persistence',
            'userReportedWorkingBaseline': {'version': '3.0.2~rc2', 'sourceCommit': '93b0304e39d1a97ba90eb0511d57e9e3780f95a2', 'archiveCommit': 'dd5e7e3ec5dd73231d65dd9e7fae18614ee8b865', 'feedbackCommit': '821e91052c5f08cb82bbb1b54c9fe15a3254e529', 'packageSha256': '59bf2fc4426c4ed78b28654af622574fc385d50c219d61d96998f9e3582fd5e4'},
            'fixtureLogs': sorted(p.name for p in (out / 'tests').glob('*.log')) if (out / 'tests').exists() else [],
            'package': json.loads(package.read_text()) if package.exists() else None,
            'macosCodesignDiagnostic': json.loads((out / 'MACOS_CODESIGN_DIAGNOSTIC.json').read_text()) if (out / 'MACOS_CODESIGN_DIAGNOSTIC.json').exists() else None,
            'deviceRuntimeTested': False, 'dopamineEllekitCompatibilityConfirmed': False,
            'limitations': ['Embedded ldid code-page hashes establish internal integrity only, not certificate authenticity, Apple trust or jailbreak acceptance',
              'No real SpringBoard/UIKit scene execution',
              'Fake private interfaces verify only the production cleanup/launch logic under supplied responses',
              'No measured CPU/battery improvement', 'Actual app launch, content, interaction and keyboard placement require a device',
              'Title-bar gestures, mirrored positioning, remote touches and size/position restoration after respring require phone testing']
          }
          (out / 'VALIDATION.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Quarantine built bytes after inspection failure
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.package.outcome != 'success' }}
        run: |
          python3 - <<'PYQUARANTINE'
          import pathlib, shutil
          output = pathlib.Path('diagnostics/quarantine')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'DO_NOT_INSTALL.txt').write_text('UNVALIDATED BUILD - DIAGNOSTICS ONLY. Package inspection failed. Do not install these bytes. See the workflow logs and VALIDATION.json.\n')
          for package in pathlib.Path('packages').glob('*.deb'):
              shutil.copyfile(package, output / package.name)
          PYQUARANTINE
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PullOverPro-3.0.2-rc3-window-move-evidence-${{ github.sha }}
          path: jondie-port/diagnostics/
          if-no-files-found: error
      - name: Upload single candidate DEB
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PullOverPro-3.0.2-rc3-rootless-${{ github.sha }}
          path: jondie-port/packages/*.deb
          if-no-files-found: error
