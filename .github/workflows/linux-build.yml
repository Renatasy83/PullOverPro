name: Linux portable tests, analysis and ABI capability gate
on:
  workflow_dispatch:
  push:
    branches: [beta-development, 'debug/**']
  pull_request:
    branches: [beta-development]
permissions:
  contents: read
jobs:
  linux-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync libtinfo6 libxml2
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Install pinned Theos, SDK and probe toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 304e0799973e8145f32e4ca2de6c747a84b758ce
          git -C "$THEOS" submodule update --init --recursive
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$RUNNER_TEMP/sdks" checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          ln -s "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/toolchain.tar.xz" https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz
          echo "836280038efc4fcc7195019cf9e2cd21b188200a38a47bbda5d26c4d0e9dee82  $RUNNER_TEMP/toolchain.tar.xz" | sha256sum --check
          mkdir -p "$THEOS/toolchain"
          tar -xJf "$RUNNER_TEMP/toolchain.tar.xz" -C "$THEOS/toolchain"
      - name: Source policy and portable sanitized fixtures
        id: portable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 scripts/verify.py | tee diagnostics/source-policy.log
          python3 tests/LifecycleTests.py | tee diagnostics/lifecycle-tests.log
          python3 scripts/validate-portable.py --output diagnostics/portable | tee diagnostics/portable.log
      - name: Cross-target Clang static analysis
        id: analysis
        shell: bash
        run: |
          set -euo pipefail
          perl "$THEOS/vendor/logos/bin/logos.pl" Tweak.xm > diagnostics/Tweak.mm
          compiler="$THEOS/toolchain/linux/iphone/bin/clang++"
          {
            for source in diagnostics/Tweak.mm *.mm preferences/*.mm tools/*/*.mm tools/*/*.m; do
              test -f "$source" || continue
              echo "Analyzing $source"
              "$compiler" --analyze -std=c++17 -Wall -Wextra -Werror -fobjc-arc -target arm64-apple-ios15.0 \
                -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -I "$THEOS/vendor/include" -I "$THEOS/include" -I . \
                -Xanalyzer -analyzer-output=text -x objective-c++ "$source"
            done
          } 2>&1 | tee diagnostics/linux-clang-analysis.log
      - name: Probe required arm64e ABI without modifying binaries
        id: abi
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'int ppo_abi_probe(void) { return 1; }' > "$RUNNER_TEMP/ppo-abi-probe.c"
          "$THEOS/toolchain/linux/iphone/bin/clang" -target arm64e-apple-ios15.0 \
            -c "$RUNNER_TEMP/ppo-abi-probe.c" -o "$RUNNER_TEMP/ppo-abi-probe.o"
          python3 - <<'PY'
          import json, os, pathlib, struct
          image = (pathlib.Path(os.environ['RUNNER_TEMP'])/'ppo-abi-probe.o').read_bytes()
          magic, cpu, subtype = struct.unpack_from('<III', image)
          supported = magic == 0xfeedfacf and cpu == 0x0100000c and subtype == 0x80000002
          pathlib.Path('diagnostics/linux-abi-probe.json').write_text(json.dumps({
            'cpuSubtype': hex(subtype), 'requiredSubtype': '0x80000002',
            'supportsRequiredABI': supported, 'headerPatchingAllowed': False,
            'packageBuildAllowed': supported
          }, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('supported='+str(supported).lower()+'\n')
          print('Required arm64e ABI supported:', supported, 'observed subtype:', hex(subtype))
          if not supported:
            print('Package build skipped; do not remove the ABI gate or relabel old binaries.')
          PY
      - name: Build and inspect rootless package only with supported ABI
        id: package
        if: steps.abi.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git -C "$THEOS" rev-parse HEAD
            "$THEOS/toolchain/linux/iphone/bin/clang" --version
            echo "Linux cross-build; SDK16.5; deployment15.0; rootless; no iOS execution"
          } > diagnostics/linux-build-environment.txt
          make SHELL=/bin/bash clean
          make SHELL=/bin/bash -j2 package FINALPACKAGE=1 2>&1 | tee diagnostics/linux-build.log
          if grep -E 'incompatible arm64e ABI|error:' diagnostics/linux-build.log; then exit 1; fi
          python3 scripts/verify.py packages/*.deb | tee diagnostics/package-policy.log
          python3 scripts/verify-linux-package.py packages/*.deb | tee diagnostics/linux-package-inspection.json
          sha256sum packages/*.deb > diagnostics/SHA256SUMS
      - name: Record actual validation scope
        if: always()
        env:
          PORTABLE_STATUS: ${{ steps.portable.outcome }}
          ANALYSIS_STATUS: ${{ steps.analysis.outcome }}
          PACKAGE_STATUS: ${{ steps.package.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('diagnostics')
          root.mkdir(exist_ok=True)
          fixture = root/'portable/portable-results.json'
          results = json.loads(fixture.read_text()) if fixture.exists() else []
          probe = root/'linux-abi-probe.json'
          abi = json.loads(probe.read_text()) if probe.exists() else None
          pathlib.Path('diagnostics/LINUX_VALIDATION.json').write_text(json.dumps({
            'commit': os.environ['GITHUB_SHA'], 'host': 'ubuntu-22.04',
            'portableSuitesPassed': sum(r['compileExit'] == 0 and r['testExit'] == 0 for r in results),
            'sourceAndLifecyclePassed': os.environ['PORTABLE_STATUS'] == 'success',
            'crossTargetStaticAnalysis': os.environ['ANALYSIS_STATUS'] == 'success',
            'abiProbe': abi, 'rootlessCrossBuild': os.environ['PACKAGE_STATUS'] == 'success',
            'macOSObjectiveCTestsExecuted': False, 'full37SuiteValidation': False,
            'deviceRuntimeTested': False, 'dopamineEllekitCompatibilityConfirmed': False,
            'installRecommendation': False,
            'limitations': ['macOS native fixtures await hosted runner',
              'Toolchain version alone does not prove arm64e ABI compatibility',
              'No package when arm64e ABI probe is unsupported', 'UIKit scene return needs real device']
          }, indent=2)+'\n')
          PY
      - name: Upload scoped evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PullOverPro-RC13-linux-evidence-${{ github.sha }}
          path: |
            diagnostics/*.log
            diagnostics/*.json
            diagnostics/*.txt
            diagnostics/SHA256SUMS
            diagnostics/portable/*.log
            diagnostics/portable/portable-results.json
          if-no-files-found: error
      - name: Upload package only after actual build and binary verification
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PullOverPro-RC13-linux-deb-${{ github.sha }}
          path: packages/*.deb
          if-no-files-found: error
